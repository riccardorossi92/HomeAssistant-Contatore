recupera_ticket:
  name: Recupera un ticket
  description: >-
    Riprende un ticket già esistente presso il distributore (Duereti o
    Unareti), saltando la chiamata requestExport. Utile quando si è ottenuto
    un ticket per altre vie (es. una chiamata manuale con curl/Bruno) o
    quando l'integrazione ne aveva perso uno ancora valido: evita di
    chiedere un nuovo export, che è la chiamata più spesso bloccata dal WAF.
    Se c'è già un recupero in corso viene annullato (il suo ticket resta
    annotato nei log).
  fields:
    ticket:
      name: Ticket
      description: L'identificativo restituito da requestExport.
      required: true
      example: ENdZS6CausBMlUzrS3as5Q
      selector:
        text:
    data_da:
      name: Data inizio
      description: >-
        Inizio del periodo coperto dal ticket. Solo un'etichetta per i sensori
        diagnostici, non influenza i dati importati (che arrivano interamente
        dal file). Se omessa si assume il primo giorno del mese precedente.
      required: false
      example: "2026-07-01"
      selector:
        date:
    data_a:
      name: Data fine
      description: >-
        Fine del periodo coperto dal ticket. Come sopra, è solo un'etichetta.
        Se omessa si assume l'ultimo giorno del mese precedente.
      required: false
      example: "2026-07-31"
      selector:
        date:
    entry_id:
      name: ID configurazione
      description: >-
        Necessario solo se hai più istanze Duereti/Unareti configurate, per
        indicare su quale agire. Con una sola istanza lascialo vuoto.
      required: false
      selector:
        text:

recupera_storico:
  name: Recupera storico
  description: >-
    Richiede al distributore i dati di un periodo passato e li importa.
    Funziona sia per Duereti/Unareti (un'unica richiesta per l'intero
    periodo, il recupero può restare in coda per ore) sia per
    E-Distribuzione (una richiesta per ogni giorno del periodo, in
    sequenza - più lento su periodi lunghi ma senza attesa in coda). Il
    recupero dello storico non è automatico: sei tu a decidere quando e
    quanto recuperare. Per Duereti/Unareti le API accettano al massimo 6
    mesi per richiesta (limite documentato); per E-Distribuzione è un
    limite di cortesia auto-imposto, non un vincolo noto delle loro API.
    Per periodi più lunghi ripeti l'azione su intervalli consecutivi.
  fields:
    data_da:
      name: Data inizio
      description: >-
        Primo giorno del periodo da recuperare. Per Duereti/Unareti non può
        essere anteriore a 6 mesi prima della data di fine.
      required: true
      example: "2026-02-01"
      selector:
        date:
    data_a:
      name: Data fine
      description: >-
        Ultimo giorno del periodo da recuperare. I dati sono disponibili con un
        giorno di ritardo, quindi al massimo ieri.
      required: true
      example: "2026-07-31"
      selector:
        date:
    entry_id:
      name: ID configurazione
      description: >-
        Necessario solo se hai più istanze configurate (Duereti/Unareti/
        E-Distribuzione).
      required: false
      selector:
        text:
