[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    # I commenti (in italiano, spesso citazioni di messaggi reali delle API)
    # sfondano regolarmente le 100 colonne. Il codice vero resta sotto.
    "E501",
    # `isinstance(x, (A, B))` e' piu' veloce a runtime di `isinstance(x, A | B)`:
    # ruff stessa ha ritirato questa raccomandazione, la teniamo disattivata.
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
# I test costruiscono di proposito classi/fixture con nomi e strutture
# "innaturali" per simulare le risposte delle API.
"tests/**" = ["B011", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
